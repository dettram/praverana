[project]
name = "praverana"
version = "0.1.0"
description = "Локальный аудит проектной документации по нормативной базе Республики Беларусь"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-docx>=1.2",
    "pypdf>=5",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
