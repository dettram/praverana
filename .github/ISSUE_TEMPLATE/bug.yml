name: Ошибка
description: Проверка пропускает дефект, отчёт падает, разметка ломает файл
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Что произошло
      description: Ожидаемое и фактическое поведение
      placeholder: |
        Ожидал: замечание «отменённая норма» для СНБ 2.04.02-2000
        Фактически: строка не появилась в отчёте
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Как повторить
      description: Папка, файл, команда или шаги в интерфейсе
      placeholder: |
        1. uv run --with python-docx python samples/make_demo.py
        2. uv run ... python app/engine.py --path samples/demo-project
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что считаем исправленным
      description: Проверяемый результат, а не «стало лучше»
      placeholder: |
        На демо-проекте появляется замечание «отменённая норма» с шифром и файлом
        Тест: tests/test_engine.py::test_outdated_code
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Чем подтвердим
      description: Тест, JSON-диф, скриншот до/после или страница отчёта
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Место в документе
      description: Файл и пункт, если дело в проверке нормы
      placeholder: "ПЗ-демо.docx, абзац 3; СН 1.03.04-2020, п. 7.7"
  - type: textarea
    id: env
    attributes:
      label: Окружение
      description: ОС, версия Python, наличие корпуса и реестра
      placeholder: "Windows 11, Python 3.13, корпус подключён, фонд 747 файлов"
  - type: dropdown
    id: area
    attributes:
      label: Область
      options:
        - проверки движка
        - отчёт DOCX/PDF
        - разметка Word
        - история прогонов
        - интерфейс
        - корпус и реестр
        - лендинг
        - документация
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Проверено
      options:
        - label: Повторил на чистой папке
        - label: Проверил на samples/demo-project или синтетике
          required: true
        - label: Нет текстов норм и данных заказчика в описании
          required: true
