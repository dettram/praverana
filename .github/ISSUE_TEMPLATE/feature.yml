name: Задача
description: Новая проверка, формат отчёта, улучшение интерфейса
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Что должно появиться
      description: Результат, который видит инженер
      placeholder: "В отчёте — раздел «ссылки на отменённые нормы с датой отмены»"
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: Правило проверки
      description: Как решается без модели — что сверяется и с чем
      placeholder: "Шифр из текста → колонка «Заменяет / чем заменён» реестра → дата замены"
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Критерии приёмки
      description: Что проверяем и чем; без «стало лучше»
      placeholder: |
        На демо-проекте видно замечание с шифром и файлом
        Скриншот /app: строка в таблице, фильтр по категории
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Чем подтвердим
      description: Тест, скриншот, JSON-диф или страница отчёта
    validations:
      required: true
  - type: textarea
    id: falsepos
    attributes:
      label: Где правило может ошибиться
      description: Ложные срабатывания и как их отличить
  - type: textarea
    id: out
    attributes:
      label: Что не входит
      description: Границы задачи, чтобы PR не расползался
  - type: dropdown
    id: area
    attributes:
      label: Область
      options:
        - проверки движка
        - отчёт DOCX/PDF
        - разметка Word
        - история прогонов
        - интерфейс
        - корпус и реестр
        - лендинг
        - документация
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Проверено
      options:
        - label: Правило проверяется без модели и сети
          required: true
        - label: Нет текстов норм и данных заказчика в описании
          required: true
